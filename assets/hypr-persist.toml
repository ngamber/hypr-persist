# hypr-persist — session persistence for Hyprland
# Place this file at ~/.config/hypr/hypr-persist.toml

[general]
# Seconds between automatic session snapshots
save_interval = 120

# Where session files are stored. The directory is kept at mode 0700 and
# session files at 0600. Symlinks are refused. Writes are atomic.
session_dir = "~/.local/share/hypr-persist"

# Restore the pinned session on daemon start, or the newest session when
# nothing is pinned. A regular file named "disabled" in this directory
# (a symlink in that place counts too, and is not followed) turns that off.
# A stamp under $XDG_RUNTIME_DIR/hypr-persist stops a second automatic
# restore in the same Hyprland instance.
restore_on_start = true

# Wait this many extra seconds before saving when the only change is windows
# closing. Opening or moving a window saves on that wake instead.
settle_delay = 10

# Skip restore-on-start when more than this many windows already exist,
# counted after include/exclude rules.
max_preexisting_windows = 3

# Call notify-send after a manual or automatic restore. Dry-run does not.
notify = true

# Launch one command per window (true) or one per unique app (false)
per_window_launch = false

# Restore floating window position and size
restore_geometry = true

# Reconstruct tiling layout from saved window positions (dwindle and master).
# When disabled, windows are restored to the correct workspace but use
# Hyprland's default placement instead of matching the original splits.
restore_layout = true

[rules]
# Regex patterns for window classes to exclude from session tracking
exclude = [
    "^xdg-desktop-portal.*",
    "^org\\.kde\\.polkit.*",
]

# If set, only track window classes matching these patterns (allowlist)
# include = []

[overrides]
# Manual class → launch command mappings (overrides auto-detection)
# "app.zen_browser.zen" = "flatpak run app.zen_browser.zen"
# "steam_app_.*" = ""  # empty string = skip this class

[experimental]
# Reserved for future experimental features.
